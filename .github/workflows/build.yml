name: Build NekokoLPA2

on:
  push:
    branches: [release, master, 'hzzmonetvn/**']
  pull_request:
    branches: [release, master]
  workflow_dispatch:
    inputs:
      architecture:
        description: Android architecture
        type: choice
        required: true
        default: all
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
      component:
        description: Component to build
        type: choice
        required: true
        default: all
        options:
          - all
          - community
          - privileged
          - otbridge
          - integrated
      android_tools_only:
        description: Build rooted app and OTBridge only; attach to the existing app release
        type: boolean
        default: false

permissions:
  contents: write

env:
  ANDROID_PACKAGE_ID: ee.nekoko.nlpa2.open
  # Where GmPlugin fetches a GM card's PSK. Builds without it still compile
  # and run; they just use only PSKs already cached on the device.
  GM_PSK_URL: https://key.9esim.com/psk

jobs:
  meta:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_clean: ${{ steps.version.outputs.version_clean }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_ONLY: ${{ inputs.android_tools_only }}
        run: |
          set -euo pipefail
          version_name="$(awk -F '"' '/^[[:space:]]*versionName[[:space:]]*=/ { print $2; exit }' android/app/build.gradle.kts)"
          version_code="$(awk -F '=' '/^[[:space:]]*versionCode[[:space:]]*=/ { gsub(/[^0-9]/, "", $2); print $2; exit }' android/app/build.gradle.kts)"
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "Failed to extract versionName/versionCode from android/app/build.gradle.kts" >&2
            exit 1
          fi
          version="${version_name}+${version_code}"
          version_clean="${version_name}-${version_code}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_clean=$version_clean" >> "$GITHUB_OUTPUT"
          if [ "$TOOLS_ONLY" = true ]; then
            gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

  rust-check:
    name: Rust lint, test & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Build Rust docs
        run: cargo doc --workspace --no-deps
      - name: Run script unit tests
        run: python3 -m unittest discover -s test/scripts -p "test_*.py" -v

  android:
    name: 'Build Android (${{ matrix.flavor }}: ${{ matrix.abi }})'
    if: inputs.android_tools_only || inputs.component != 'otbridge'
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.android_tools_only && '["privileged"]' || inputs.component == 'community' && '["community"]' || inputs.component == 'privileged' && '["privileged"]' || inputs.component == 'integrated' && '["privileged"]' || '["community","privileged"]') }}
        abi: ${{ fromJSON((inputs.architecture == 'all' || inputs.architecture == '') && '["all"]' || format('["{0}"]', inputs.architecture)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Locate or install Android NDK
        run: |
          set -euo pipefail
          ndk_dir="$(ls -d "${ANDROID_HOME}/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$ndk_dir" ]; then
            yes | sdkmanager "ndk;27.2.12479018" >/dev/null
            ndk_dir="${ANDROID_HOME}/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "Using NDK at $ndk_dir"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-ndk
      - name: Build Rust native libraries with cargo-ndk
        env:
          BUILD_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          ndk_args=()
          if [ "$BUILD_ABI" = "all" ]; then
            ndk_args+=(-t arm64-v8a -t armeabi-v7a)
          else
            case "$BUILD_ABI" in
              arm64-v8a|armeabi-v7a) ndk_args+=(-t "$BUILD_ABI") ;;
              *) echo "Unsupported ABI: $BUILD_ABI" >&2; exit 1 ;;
            esac
          fi
          mkdir -p android/app/src/main/jniLibs
          cargo ndk "${ndk_args[@]}" -o android/app/src/main/jniLibs build -p rust_lib_nlpa2 --release
      - name: Run Android unit tests
        if: matrix.flavor == 'community'
        working-directory: android
        run: ./gradlew testCommunityReleaseUnitTest
      - name: Build APK
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
          BUILD_ABI: ${{ matrix.abi }}
        working-directory: android
        run: |
          gradle_args=()
          if [ "$BUILD_ABI" != "all" ]; then
            gradle_args+=(-PbuildAbi="$BUILD_ABI")
          fi
          cap_flavor="$(tr '[:lower:]' '[:upper:]' <<< "${BUILD_FLAVOR:0:1}")${BUILD_FLAVOR:1}"
          ./gradlew "assemble${cap_flavor}Release" "${gradle_args[@]}"
      - name: Package Android artifacts
        env:
          VERSION_CLEAN: ${{ needs.meta.outputs.version_clean }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD_FLAVOR: ${{ matrix.flavor }}
          BUILD_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "Generated APK files in build output:"
          find build android/app/build -name "*.apk" 2>/dev/null || true
          first_existing() {
            for candidate in "$@"; do
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }
          find_apk() {
            local flavor="$1"
            local abi="$2"
            first_existing \
              "build/app/outputs/apk/${flavor}/release/app-${flavor}-${abi}-release.apk" \
              "build/app/outputs/apk/${flavor}/release/app-${abi}-${flavor}-release.apk" \
              "android/app/build/outputs/apk/${flavor}/release/app-${flavor}-${abi}-release.apk" \
              "android/app/build/outputs/apk/${flavor}/release/app-${abi}-${flavor}-release.apk"
          }
          abi_suffix="$BUILD_ABI"
          if [ "$BUILD_ABI" = all ]; then abi_suffix=arm64-v8a; fi
          if [ "$BUILD_FLAVOR" = privileged ]; then
            APK=$(find_apk privileged "$abi_suffix") || {
              echo "Missing privileged APK for $BUILD_ABI" >&2
              exit 1
            }
            cp "$APK" "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-rooted-${abi_suffix}.apk"
            if [ "$BUILD_ABI" = all ] || [ "$BUILD_ABI" = arm64-v8a ]; then
              python3 scripts/package_rooted_android.py --apk "$APK" \
                --output "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-magisk.zip" --version "$VERSION"
            fi
          else
            if [ "$BUILD_ABI" = all ]; then
              for abi in armeabi-v7a arm64-v8a; do
                APK=$(find_apk community "$abi") || continue
                cp "$APK" "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-${abi}.apk"
              done
              APK=$(first_existing \
                build/app/outputs/apk/community/release/app-community-universal-release.apk \
                build/app/outputs/apk/community/release/app-universal-community-release.apk \
                build/app/outputs/apk/community/release/app-community-release.apk \
                android/app/build/outputs/apk/community/release/app-community-universal-release.apk \
                android/app/build/outputs/apk/community/release/app-universal-community-release.apk \
                android/app/build/outputs/apk/community/release/app-community-release.apk) || true
              if [ -n "${APK:-}" ]; then
                cp "$APK" "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-universal.apk"
              fi
            else
              APK=$(find_apk community "$BUILD_ABI") || {
                echo "Missing community APK for $BUILD_ABI" >&2
                exit 1
              }
              cp "$APK" "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-${BUILD_ABI}.apk"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error

  otbridge:
    name: Build OTBridge helper and module
    if: inputs.android_tools_only || inputs.component == '' || inputs.component == 'all' || inputs.component == 'otbridge' || inputs.component == 'integrated'
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build and package the bridge
        working-directory: otbridge
        run: |
          ./gradlew :app:assembleRelease
          ./scripts/build.sh
          version=$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/otbridge-${version}.apk"
          cp "build/otbridge-magisk-kernelsu-v${version}.zip" ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: otbridge
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/release' || inputs.android_tools_only) &&
      needs.meta.result == 'success' &&
      needs.rust-check.result == 'success' &&
      needs.android.result == 'success' && needs.otbridge.result == 'success' &&
      (inputs.android_tools_only || (
        (inputs.component == 'all' || inputs.component == '') &&
        (inputs.architecture == 'all' || inputs.architecture == '')
      ))
    needs: [meta, rust-check, android, otbridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          VERSION_CLEAN: ${{ needs.meta.outputs.version_clean }}
          TOOLS_ONLY: ${{ inputs.android_tools_only }}
        run: |
          set -euo pipefail
          tag_name="v$VERSION"
          if [ "$TOOLS_ONLY" = true ]; then
            gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null
            gh release upload "$tag_name" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          release_notes="$(awk -v ver="[$VERSION]" 'index($0, "## " ver) == 1 {p=1; next} p && /^## \[/ {p=0} p' CHANGELOG.md | sed '/^$/d' | head -n 20)"
          if [ -z "$release_notes" ]; then
            release_notes="Public Android builds for NekokoLPA2 v$VERSION"
          fi

          artifact_table="$(cat <<EOF
          | Artifact | Platform | Description |
          | --- | --- | --- |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-armeabi-v7a.apk\` | Android (ARMv7) | Community Split APK (ARMv7) |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-arm64-v8a.apk\` | Android (ARM64) | Community Split APK (ARM64) |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-universal.apk\` | Android | Community Universal APK |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-rooted-arm64-v8a.apk\` | Rooted Android | Full privileged app APK |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-magisk.zip\` | Rooted Android | Full app systemless module |
          | \`otbridge-*.apk\` | Rooted Android | Small OMAPI/TMAPI helper |
          | \`otbridge-magisk-kernelsu-*.zip\` | Rooted Android | Helper systemless module |
          EOF
          )"

          full_notes="$release_notes

          ## Artifacts

          $artifact_table"

          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag_name" --repo "$GITHUB_REPOSITORY" \
              --title "NekokoLPA2 $tag_name" --notes "$full_notes"
          else
            gh release create "$tag_name" --repo "$GITHUB_REPOSITORY" \
              --title "NekokoLPA2 $tag_name" --notes "$full_notes"
          fi

          shopt -s nullglob
          uploads=(dist/*)
          if [ ${#uploads[@]} -gt 0 ]; then
            gh release upload "$tag_name" "${uploads[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
