name: Build NekokoLPA2

on:
  push:
    branches: [release, master]
  pull_request:
    branches: [release, master]
  workflow_dispatch:
    inputs:
      architecture:
        description: Android architecture
        type: choice
        required: true
        default: all
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
      component:
        description: Component to build
        type: choice
        required: true
        default: all
        options:
          - all
          - community
          - privileged
          - otbridge
          - integrated
      android_tools_only:
        description: Build rooted app and OTBridge only; attach to the existing app release
        type: boolean
        default: false

permissions:
  contents: write

env:
  ANDROID_PACKAGE_ID: ee.nekoko.nlpa2.open
  # Pinned so a stable-channel release cannot change the toolchain under us:
  # 3.47.2 turned Flutter's Gradle/AGP/Kotlin minimums from warnings into
  # errors. Bump deliberately, together with the versions in android/.
  FLUTTER_VERSION: 3.47.2
  # Where GmPlugin fetches a GM card's PSK. Builds without it still compile
  # and run; they just use only PSKs already cached on the device.
  GM_PSK_URL: https://key.9esim.com/psk

jobs:
  meta:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_clean: ${{ steps.version.outputs.version_clean }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS_ONLY: ${{ inputs.android_tools_only }}
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          version_clean="${version//+/-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_clean=$version_clean" >> "$GITHUB_OUTPUT"
          if [ "$TOOLS_ONLY" = true ]; then
            gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

  android:
    name: 'Build Android (${{ matrix.flavor }}: ${{ matrix.abi }})'
    if: inputs.android_tools_only || inputs.component != 'otbridge'
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.android_tools_only && '["privileged"]' || inputs.component == 'community' && '["community"]' || inputs.component == 'privileged' && '["privileged"]' || inputs.component == 'integrated' && '["privileged"]' || '["community","privileged"]') }}
        abi: ${{ fromJSON((inputs.architecture == 'all' || inputs.architecture == '') && '["all"]' || format('["{0}"]', inputs.architecture)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Install Rust bridge code generator
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Verify generated Rust bridge bindings
        run: |
          flutter_rust_bridge_codegen generate
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs
          test -z "$(git ls-files --others --exclude-standard -- lib/src/rust rust/src/frb_generated.rs)"
      - run: flutter gen-l10n
      - run: dart analyze
        if: matrix.flavor == 'community'
      - run: flutter test
        if: matrix.flavor == 'community'
      - name: Build APK
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
          BUILD_ABI: ${{ matrix.abi }}
        run: |
          args=(--release --flavor "$BUILD_FLAVOR" --target lib/main.dart --split-per-abi)
          if [ "$BUILD_ABI" = all ]; then
            args+=(--target-platform android-arm,android-arm64)
          else
            case "$BUILD_ABI" in
              arm64-v8a) args+=(--target-platform android-arm64) ;;
              armeabi-v7a) args+=(--target-platform android-arm) ;;
              *) echo "Unsupported ABI: $BUILD_ABI" >&2; exit 1 ;;
            esac
          fi
          if [ "$BUILD_FLAVOR" = privileged ]; then
            args+=(--dart-define=PRIVILEGED_BUILD=true --dart-define=APP_VARIANT=open-rooted)
          else
            args+=(--dart-define=APP_VARIANT=open)
          fi
          # Flutter 3.47.2 injects arm64-v8a, armeabi-v7a, and x86_64 into
          # defaultConfig.ndk unless filtering is disabled. Our explicit ABI
          # splits own the selection, so disable Flutter's conflicting filter.
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.project.disable-abi-filtering=true"
          gradle_args=(-Pdisable-abi-filtering=true)
          if [ "$BUILD_ABI" != "all" ]; then
            gradle_args+=(-PbuildAbi="$BUILD_ABI")
          fi
          # Build Flutter assets and Rust binaries, then produce Gradle split APKs.
          if [ "$BUILD_ABI" != "all" ]; then
            export ORG_GRADLE_PROJECT_buildAbi="$BUILD_ABI"
          fi
          flutter build apk "${args[@]}" --obfuscate --split-debug-info=build/app/outputs/symbols --dart-define=GM_PSK_URL="$GM_PSK_URL"
          cap_flavor="$(tr '[:lower:]' '[:upper:]' <<< "${BUILD_FLAVOR:0:1}")${BUILD_FLAVOR:1}"
          cd android && ./gradlew "assemble${cap_flavor}Release" "${gradle_args[@]}" && cd ..
      - name: Package Android artifacts
        env:
          VERSION_CLEAN: ${{ needs.meta.outputs.version_clean }}
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD_FLAVOR: ${{ matrix.flavor }}
          BUILD_ABI: ${{ matrix.abi }}
        run: |
          mkdir -p dist
          echo "Generated APK files in build output:"
          find build/app/outputs/ -name "*.apk" || true
          first_existing() {
            for candidate in "$@"; do
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }
          abi_suffix="$BUILD_ABI"
          if [ "$BUILD_ABI" = all ]; then abi_suffix=arm64-v8a; fi
          if [ "$BUILD_FLAVOR" = privileged ]; then
            apk_name="app-${BUILD_ABI}-privileged-release.apk"
            if [ "$BUILD_ABI" = all ]; then apk_name=app-arm64-v8a-privileged-release.apk; fi
            APK=$(first_existing "build/app/outputs/flutter-apk/$apk_name" "build/app/outputs/apk/privileged/release/$apk_name") || {
              echo "Missing privileged APK for $BUILD_ABI" >&2
              exit 1
            }
            cp "$APK" "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-rooted-${abi_suffix}.apk"
            if [ "$BUILD_ABI" = all ] || [ "$BUILD_ABI" = arm64-v8a ]; then
              python3 scripts/package_rooted_android.py --apk "$APK" \
                --output "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-magisk.zip" --version "$VERSION"
            fi
          else
            if [ "$BUILD_ABI" = all ]; then
              for abi in armeabi-v7a arm64-v8a; do
                APK=$(first_existing "build/app/outputs/flutter-apk/app-${abi}-community-release.apk" "build/app/outputs/apk/community/release/app-${abi}-community-release.apk") || continue
                cp "$APK" "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-${abi}.apk"
              done
              APK=$(first_existing build/app/outputs/flutter-apk/app-universal-community-release.apk build/app/outputs/apk/community/release/app-universal-community-release.apk build/app/outputs/flutter-apk/app-community-release.apk build/app/outputs/apk/community/release/app-community-release.apk) || true
              if [ -n "$APK" ]; then cp "$APK" "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-universal.apk"; fi
            else
              APK=$(first_existing "build/app/outputs/flutter-apk/app-${BUILD_ABI}-community-release.apk" "build/app/outputs/apk/community/release/app-${BUILD_ABI}-community-release.apk") || {
                echo "Missing community APK for $BUILD_ABI" >&2
                exit 1
              }
              cp "$APK" "dist/${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-${BUILD_ABI}.apk"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.flavor }}
          path: dist/*
          if-no-files-found: error

  otbridge:
    name: Build OTBridge helper and module
    if: inputs.android_tools_only || inputs.component == '' || inputs.component == 'all' || inputs.component == 'otbridge' || inputs.component == 'integrated'
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build and package the bridge
        working-directory: otbridge
        run: |
          ./gradlew :app:assembleRelease
          ./scripts/build.sh
          version=$(awk -F '"' '/versionName =/ {print $2; exit}' app/build.gradle.kts)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/otbridge-${version}.apk"
          cp "build/otbridge-magisk-kernelsu-v${version}.zip" ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: otbridge
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: >-
      always() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/release' || inputs.android_tools_only) &&
      needs.meta.result == 'success' &&
      needs.android.result == 'success' && needs.otbridge.result == 'success' &&
      (inputs.android_tools_only || (
        (inputs.component == 'all' || inputs.component == '') &&
        (inputs.architecture == 'all' || inputs.architecture == '')
      ))
    needs: [meta, android, otbridge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          VERSION_CLEAN: ${{ needs.meta.outputs.version_clean }}
          TOOLS_ONLY: ${{ inputs.android_tools_only }}
        run: |
          set -euo pipefail
          tag_name="v$VERSION"
          if [ "$TOOLS_ONLY" = true ]; then
            gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null
            gh release upload "$tag_name" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          release_notes="$(awk -v ver="[$VERSION]" 'index($0, "## " ver) == 1 {p=1; next} p && /^## \[/ {p=0} p' CHANGELOG.md | sed '/^$/d' | head -n 20)"
          if [ -z "$release_notes" ]; then
            release_notes="Public Android builds for NekokoLPA2 v$VERSION"
          fi

          artifact_table="$(cat <<EOF
          | Artifact | Platform | Description |
          | --- | --- | --- |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-armeabi-v7a.apk\` | Android (ARMv7) | Community Split APK (ARMv7) |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-arm64-v8a.apk\` | Android (ARM64) | Community Split APK (ARM64) |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-universal.apk\` | Android | Community Universal APK |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-rooted-arm64-v8a.apk\` | Rooted Android | Full privileged app APK |
          | \`${ANDROID_PACKAGE_ID}-${VERSION_CLEAN}-magisk.zip\` | Rooted Android | Full app systemless module |
          | \`otbridge-*.apk\` | Rooted Android | Small OMAPI/TMAPI helper |
          | \`otbridge-magisk-kernelsu-*.zip\` | Rooted Android | Helper systemless module |
          EOF
          )"

          full_notes="$release_notes

          ## Artifacts

          $artifact_table"

          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag_name" --repo "$GITHUB_REPOSITORY" \
              --title "NekokoLPA2 $tag_name" --notes "$full_notes"
          else
            gh release create "$tag_name" --repo "$GITHUB_REPOSITORY" \
              --title "NekokoLPA2 $tag_name" --notes "$full_notes"
          fi

          shopt -s nullglob
          uploads=(dist/*)
          if [ ${#uploads[@]} -gt 0 ]; then
            gh release upload "$tag_name" "${uploads[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
