[package]
name = "rust_lib_nlpa2"
version = "2.5.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nlpa_core = { path = "core" }
nlpa_ui = { path = "ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "android")'.dependencies]
# The JNI entry points in this crate are written against 0.21: 0.22 split
# `JNIEnv` into `Env` and `EnvUnowned` and renamed the methods with it.
jni = "=0.21.1"
libc = "0.2"

[lints]
workspace = true
