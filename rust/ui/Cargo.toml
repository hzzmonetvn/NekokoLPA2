[package]
name = "nlpa_ui"
version = "2.5.0"
edition = "2021"

[lib]
name = "nlpa_ui"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.6", default-features = false, features = ["macro", "hooks", "html", "signals"] }
dioxus-ssr = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
nlpa_core = { path = "../core" }

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
