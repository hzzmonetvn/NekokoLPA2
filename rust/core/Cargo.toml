[package]
name = "nlpa_core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
rm-client-core = "0.1.0"
rm-qmi = { version = "0.1.0", features = ["qrtr"] }
flutter_rust_bridge = "=2.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
quick-xml = "0.42.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true

